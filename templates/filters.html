<form class="filters" id="filters" method="get">{% if request.args.get('prazo') %}<input type="hidden" name="prazo" value="{{request.args['prazo']}}">{% endif %}
<label>Período<select name="periodo" id="periodo">{% for key,label in [('hoje','Hoje'),('ontem','Ontem'),('semana','Esta semana'),('mes','Este mês'),('anterior','Mês anterior'),('custom','Personalizado')] %}<option value="{{key}}" {{'selected' if request.args.get('periodo',default_period|default('hoje'))==key}}>{{label}}</option>{% endfor %}</select></label>
<label>Unidade<select name="unidade"><option value="">Todas</option>{% for u in unidades %}<option {{'selected' if request.args.get('unidade')==u}}>{{u}}</option>{% endfor %}</select></label>
<label>Tipo de OS<select name="tipo"><option value="">Todos</option>{% for t in tipos %}<option {{'selected' if request.args.get('tipo')==t}}>{{t}}</option>{% endfor %}</select></label>
<label>Status<select name="status"><option value="">Todos</option>{% for s in statuses %}<option {{'selected' if request.args.get('status')==s}}>{{s}}</option>{% endfor %}</select></label>
<label>Consultor<select name="consultor"><option value="">Todos</option>{% for c in consultores %}<option value="{{c.id}}" {{'selected' if request.args.get('consultor')==c.id|string}}>{{c.nome}}</option>{% endfor %}{% for c in consultores_mensais %}<option value="mensal:{{c.codigo}}" {{'selected' if request.args.get('consultor')=='mensal:'+c.codigo}}>{{c.nome}} ({{c.codigo}})</option>{% endfor %}</select></label><button class="btn btn-primary" type="submit">⟳ &nbsp; Atualizar</button>
<div class="custom-dates" id="custom-dates"><label>Data inicial<input type="date" name="inicio" value="{{request.args.get('inicio','')}}"></label><label>Data final<input type="date" name="fim" value="{{request.args.get('fim','')}}"></label></div>
</form>
