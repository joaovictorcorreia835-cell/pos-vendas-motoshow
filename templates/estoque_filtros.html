<form method="get" class="panel monthly-selector"><label>Localizar moto<input name="q" placeholder="Chassi completo, parte do chassi ou modelo" value="{{request.args.get('q','')}}"></label><label>Unidade<select name="unidade"><option value="">Todas</option>{% for u in unidades_estoque %}<option {{'selected' if request.args.get('unidade')==u.nome}}>{{u.nome}}</option>{% endfor %}</select></label><label>Localização<select name="localizacao"><option value="">Todas</option>{% for l in locais_estoque %}<option value="{{l.codigo}}" {{'selected' if request.args.get('localizacao')==l.codigo}}>{{l.nome}}</option>{% endfor %}</select></label><label>Status comercial<select name="status"><option value="">Todos</option>{% for s in comerciais %}<option {{'selected' if request.args.get('status')==s}}>{{s}}</option>{% endfor %}</select></label><label>Presença<select name="confirmada"><option value="">Todas</option><option value="sim" {{'selected' if request.args.get('confirmada')=='sim'}}>Confirmada</option><option value="nao" {{'selected' if request.args.get('confirmada')=='nao'}}>Não confirmada</option></select></label><label>Divergência<select name="divergencia"><option value="">Todas</option><option value="sim" {{'selected' if request.args.get('divergencia')=='sim'}}>Com divergência</option><option value="nao" {{'selected' if request.args.get('divergencia')=='nao'}}>Sem divergência</option></select></label><label>Dias em estoque<select name="dias"><option value="">Todos</option>{% for d in [15,30,45,60,90] %}<option value="{{d}}" {{'selected' if request.args.get('dias')==d|string}}>Mais de {{d}} dias</option>{% endfor %}</select></label><label>Registros<select name="situacao"><option value="">Ativas sem saída</option><option value="saidas" {{'selected' if request.args.get('situacao')=='saidas'}}>Saídas confirmadas</option><option value="todas" {{'selected' if request.args.get('situacao')=='todas'}}>Todos</option></select></label><label>Última conferência<select name="conferencia"><option value="">Todas</option>{% for c in ['CONFERIDA HOJE','CONFERIDA RECENTEMENTE','CONFERÊNCIA A RENOVAR','CONFERÊNCIA VENCIDA','NUNCA CONFERIDA'] %}<option {{'selected' if request.args.get('conferencia')==c}}>{{c}}</option>{% endfor %}</select></label><button class="btn btn-primary">Filtrar</button><a class="btn btn-outline-info" href="{{request.path}}">Limpar</a></form>
