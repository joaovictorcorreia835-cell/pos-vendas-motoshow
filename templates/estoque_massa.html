{% extends 'estoque_base.html' %}{% block estoque %}<h2>Conferência em massa</h2><section class="panel"><p>Informe até 100 chassis completos, um por linha. Todos serão conferidos na localização escolhida. Um erro recusa o lote inteiro. Para contar itens esperados e extras, use Inventários.</p><form method="post"><input type="hidden" name="csrf" value="{{csrf}}"><label>Chassis<textarea name="chassis" rows="10" required></textarea></label><label>Localização<select name="localizacao" required>{% for l in locais_estoque %}<option value="{{l.id}}">{{l.nome}}</option>{% endfor %}</select></label><label>Observação<input name="observacao" maxlength="1000"></label><button class="btn btn-primary">Confirmar presença de todo o lote</button></form></section>{% endblock %}
