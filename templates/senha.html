{% extends 'base.html' %}{% block content %}<section class="panel" style="max-width:520px"><h2>Alterar minha senha</h2><form method="post"><input type="hidden" name="csrf" value="{{csrf}}"><label class="d-block mb-3">Senha atual<input type="password" name="atual" autocomplete="current-password" required></label><label class="d-block mb-3">Nova senha<input type="password" name="nova" autocomplete="new-password" minlength="12" required></label><label class="d-block mb-3">Repita a nova senha<input type="password" name="confirmar" autocomplete="new-password" minlength="12" required></label><button class="btn btn-primary">Salvar senha e entrar novamente</button></form></section>{% endblock %}
